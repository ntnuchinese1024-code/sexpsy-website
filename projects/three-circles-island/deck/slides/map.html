<aside>這是工具打開後的樣子。每個項目都是一座立體的小島，可以自己選圖示和地形，讓地圖真的長得像自己的。有些人會把群島取名叫「慢慢來群島」，內圈改叫「我的紅線」。命名這件事本身，就是一種把復元拿回自己手上的練習。</aside>
