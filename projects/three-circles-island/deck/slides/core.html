<p style="font-size:26px;letter-spacing:6px;color:#E0A88F;font-weight:500">這個工具最想說的一件事</p>
<h1 style="font-family:'Noto Serif TC', Georgia, serif;font-size:88px;font-weight:700;line-height:1.35;color:#F9F6F0">復元的核心，<br>不是把內圈填滿，<br>而是<span style="color:#B9D3AE">讓外圈長大</span>。</h1>
<p style="font-size:32px;line-height:1.7;color:#D9CCBF;width:1300px">限制很重要，但生活不只是限制。外圈的事也可能在壓力大時變成負擔，這時候先降到 Plan C，對自己溫柔一點。</p>
<aside>這是我最想強調的。很多人一開始畫三圈，會把內圈寫得很滿、很嚴格，好像限制越多越安全。但面對癮，真正能撐住一個人的，是外圈：那些讓生活有意思、有連結的事。所以工具會在內圈的島比外圈多的時候，溫和地提醒：要不要新增一座外圈島嶼？</aside>
</section>
