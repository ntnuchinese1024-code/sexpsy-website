<aside>中圈是我最喜歡的設計。以藥物與性為例，交友軟體本身不是壞東西，它滿足的是想被看見、想有連結的需求。用約砲取向的 App、深夜一個人滑，就容易往內圈陷落；用交友為主的平台、白天使用、先約公開場所，就能幫助他往外圈建構生活。使用者會寫下兩邊，再用滑桿標出自己現在的位置，每一次移動都會被記下來，看得到它怎麼漂。</aside>
